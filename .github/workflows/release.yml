name: Release

# Started by hand from the Actions page on main. It builds the Windows installer
# for the version in package.json and publishes it as a draft release whose tag
# does not exist yet. A draft is invisible to installed copies: they read the
# latest published release only, so a build reaches users once its manual
# acceptance has passed and the draft is published from the Releases page, which
# is also when the tag is created on the commit this run built.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Build, sign manifest and draft the Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      CI: "true"
      APP_RUNTIME: test
      LOCAL_DATABASE_FILE: .desktop-data/release/${{ github.run_id }}-${{ github.run_attempt }}/app.db
      OPENROUTER_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Before the build, so a version that was already released is refused in
      # seconds rather than after the installer has been made.
      - name: Read the version and refuse one already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Run the release from main, not ${{ github.ref }}." }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          # The listing includes drafts, which have no tag yet.
          $existing = gh release list --limit 200 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Could not list existing releases." }
          if ($existing -contains $tag) { throw "A release for $tag already exists. Raise the version with npm run desktop:version first." }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Raise the version with npm run desktop:version first." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.9.0"
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@11.19.1

      - name: Report toolchain versions
        run: |
          node --version
          npm --version
          if ((npm --version) -ne "11.19.1") { throw "Expected npm 11.19.1" }

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Provision Electron runtime for CI
        run: node node_modules/electron/install.js

      - name: Test desktop startup, paths, migrations and updates
        run: npm run test:desktop

      - name: Build standalone desktop runtime
        run: npm run desktop:build

      - name: Create Windows installer
        run: node scripts/make-desktop.mjs --skip-build

      - name: Verify packaged application
        run: npm run desktop:verify

      - name: Smoke-test packaged application
        run: npm run test:desktop:package

      - name: Verify compiled installer
        run: ./scripts/verify-windows-installer.ps1

      - name: Sign the update manifest
        env:
          RIA_UPDATE_SIGNING_KEY: ${{ secrets.RIA_UPDATE_SIGNING_KEY }}
        run: npm run desktop:update-manifest

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $directory = "out/make/wix/x64"
          gh release create "${{ steps.release.outputs.tag }}" --draft --target "${{ github.sha }}" --title "RiA $version" --notes "RiA $version for Windows x64. Publish this draft only after the Windows release acceptance has passed." `
            "$directory/RiA-$version-x64.msi" "$directory/update-manifest.json" "$directory/verification.json"

      - name: Upload release failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .desktop-data/test/electron-smoke-*/data/logs/desktop.log*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
